<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen & Nilai Stok Produk UMKM</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Praktik 3: Manajemen Produk UMKM</h1>
            <p>"JavaScript digunakan untuk mengambil data, memeriksa data, menghitung data, dan menghasilkan informasi."</p>
        </header>

        <!-- Form Input Produk Baru -->
        <div class="card">
            <h2>Tambah Produk UMKM Baru</h2>
            
            <!-- Tempat Notifikasi Sukses / Error -->
            <div id="notification"></div>

            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Nama Produk</label>
                        <input type="text" id="name" placeholder="Contoh: Pisang Goreng">
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category">
                            <option value="">Pilih Kategori</option>
                            <option value="Camilan">Camilan</option>
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">Harga (Rp)</label>
                        <input type="number" id="price" min="0" placeholder="15000">
                    </div>
                    <div class="form-group">
                        <label for="stock">Jumlah Stok</label>
                        <input type="number" id="stock" min="0" placeholder="10">
                    </div>
                </div>
                <button type="submit">Tambah Produk ke Dataset</button>
            </form>
        </div>

        <!-- Tabel Daftar Produk & Perhitungan Stok -->
        <div class="card">
            <h2>Daftar Produk & Rekapitulasi Nilai Stok</h2>
            <div style="overflow-x: auto;">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Nilai Stok</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data akan dimasukkan lewat JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="summary-box" id="totalNilaiStokBox">
                Total Nilai Stok Keseluruhan: Rp0
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
